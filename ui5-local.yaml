# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: project1
type: application
framework:
  name: SAPUI5
  version: 1.140.0
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ui.fl
    - name: sap.f
    - name: sap.ui.table
    - name: sap.viz
    - name: sap.uxap
    - name: sap.ui.layout
    - name: sap.ui.unified
    - name: sap.ushell
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
      configuration:
        debug: true
        transformTypeScript: true
        transformModulesToUI5: true
        transformAsyncToPromise: true
        targetBrowsers: "Chrome 78"
        excludePatterns:
          - /Component-preload.js
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false # If set to true, certificate errors will be ignored. E.g. self-signed certificates will be accepted
        backend:
          - path: /odata
            url: http://localhost:4004
            destination: backend
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        debug: true
        transformTypeScript: true
        transformModulesToUI5: true
        transformAsyncToPromise: true
        targetBrowsers: "Chrome 78"